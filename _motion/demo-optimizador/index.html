<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=900, height=966" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 900px;
        height: 966px;
        overflow: hidden;
        background: #05080a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Demo del Optimizador para la sección del programa en la web: se repite sin salto. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9"
      data-width="900"
      data-height="966"
    >
      <div
        id="demo"
        data-composition-id="demo"
        data-composition-src="compositions/demo.html"
        data-start="0"
        data-duration="9"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="900"
        data-height="966"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
