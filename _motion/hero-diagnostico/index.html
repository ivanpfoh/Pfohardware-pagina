<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1000, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1000px;
        height: 800px;
        overflow: hidden;
        background: #05080a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Video principal de la web: un diagnóstico sobre una PC real. Se reproduce una vez y queda en "Listo". -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.1"
      data-width="1000"
      data-height="800"
    >
      <div
        id="diagnostico"
        data-composition-id="diagnostico"
        data-composition-src="compositions/diagnostico.html"
        data-start="0"
        data-duration="4.1"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1000"
        data-height="800"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
